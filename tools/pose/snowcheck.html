<!doctype html><meta charset="utf-8"><base href="../../">
<!-- SNOW CHECK: the pose check for the SNOWMAN MONSTER (tools/pose/posecheck.html is Santa's). Body as a faint ghost, skeleton solid --
     LEFT bones BLUE, RIGHT bones RED, spine / head YELLOW. Each clip is SAMPLED at n times (default 16) with the game's own arm fit
     (enemies.js fitSnowArms, ARMFIT.snowman) applied after the clip; flags: a forearm (elbow, + its own arm thickness) or hand INSIDE the torso
     (ellipse from spine/hips-weighted vertices at that height, current pose, all in the CHEST frame = Spine1's turn since rest taken out) or a forearm / hand crossing to the other side. One row per clip, drawn at
     its WORST sample (most flags, else the middle). Usage: node tools/pose/run.cjs out.png "r=idle,walk&fit=1" snowcheck
       fit=0 -> raw clip (before), fit=1 (default) -> shipped fit, fitj={"spread":..} -> try values. -->
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
<body style="margin:0;background:#fff"><script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/GLTFLoader.js'; import { DRACOLoader } from 'three/addons/DRACOLoader.js';
import { clone as skClone } from 'three/addons/SkeletonUtils.js';
import { prep, ARMFIT } from './src/characters.js';
import { CLIPS } from './src/anim.js';
import { retargetClip } from './src/retarget.js';
import { SNOW, fitSnowArms } from './src/enemies.js';
const q = new URLSearchParams(location.search), roles = (q.get('r') || Object.keys(CLIPS.snowman).join(',')).split(','), NS = +(q.get('n') || 16);
const fit = q.get('fit') === '0' ? null : (q.get('fitj') ? { ...ARMFIT.snowman, ...JSON.parse(q.get('fitj')) } : ARMFIT.snowman);
const VW = 360, VH = 400, views = [['front', 0], ['side', Math.PI / 2], ['top', 'top']];
const W = VW * views.length, H = VH * roles.length;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); document.body.appendChild(r.domElement); r.setScissorTest(true);
const L = new GLTFLoader(); const D = new DRACOLoader(); D.setDecoderPath('./vendor/draco/'); L.setDRACOLoader(D);
const load = u => new Promise((res, rej) => L.load(u, res, undefined, rej));
const COL = { L: 0x1e6bff, R: 0xff2a2a, C: 0xf0c000 };
const side = n => /Left/.test(n) ? 'L' : /Right/.test(n) ? 'R' : 'C';
const report = { fit };
(async () => {
  const g = await load(SNOW.url);
  for (let ri = 0; ri < roles.length; ri++) {
    const role = roles[ri], stem = CLIPS.snowman[role];
    const a = await load(`./models/anims/${stem}.glb`), clip = retargetClip(a.scene, a.animations[0], g.scene, { name: role });
    const inst = skClone(g.scene), P = prep(inst, SNOW.height), Hd = P.holder, Bn = P.B;
    const sc = new THREE.Scene(); sc.background = new THREE.Color(ri % 2 ? '#f6f6f6' : '#ffffff'); sc.add(Hd);
    const mixer = new THREE.AnimationMixer(inst); mixer.clipAction(clip).play();
    let skin = null; inst.traverse(o => { if (o.isSkinnedMesh && !skin) skin = o; });
    const torsoJ = new Set(); skin.skeleton.bones.forEach((bn, i) => { if (/Hips|Spine/.test(bn.name)) torsoJ.add(i); });
    // the strongest joint per vertex, once
    const pos = skin.geometry.attributes.position, sk = skin.geometry.attributes.skinIndex, sw = skin.geometry.attributes.skinWeight, tv = [];
    for (let i = 0; i < pos.count; i += 2) { let bi = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; bi = sk.getComponent(i, k); } } if (torsoJ.has(bi)) tv.push(i); }
    // CHEST FRAME: every point is measured with Spine1's turn / lean since rest taken out (a punch twists his whole body; "his
    // left" is his chest's left, not the ground's). Rest = after prep, before the clip.
    Hd.updateMatrixWorld(true);
    const hq = Hd.getWorldQuaternion(new THREE.Quaternion()), restQ = Bn.Spine1.getWorldQuaternion(new THREE.Quaternion()), s0 = Hd.worldToLocal(Bn.Spine1.getWorldPosition(new THREE.Vector3()));
    const Rinv = new THREE.Quaternion(), sNow = new THREE.Vector3();
    const frame = () => { const w = Bn.Spine1.getWorldQuaternion(new THREE.Quaternion()); Rinv.copy(hq).invert().multiply(w).multiply(restQ.clone().invert()).multiply(hq).invert(); sNow.copy(Hd.worldToLocal(Bn.Spine1.getWorldPosition(new THREE.Vector3()))); };
    const chest = v => Hd.worldToLocal(v).sub(sNow).applyQuaternion(Rinv).add(s0);
    const loc = o => chest(o.getWorldPosition(new THREE.Vector3()));
    // the arm's own THICKNESS (his arms are fat too): mean distance of forearm-weighted vertices from the forearm bone line, at rest
    const armR = {};
    { const V = new THREE.Vector3(); for (const sd of ['Left', 'Right']) { const fi = skin.skeleton.bones.indexOf(Bn[sd + 'ForeArm']), A = Bn[sd + 'ForeArm'].getWorldPosition(new THREE.Vector3()), Bp = Bn[sd + 'Hand'].getWorldPosition(new THREE.Vector3()), line = new THREE.Line3(A, Bp), c = new THREE.Vector3(); let sum = 0, n = 0;
      for (let i = 0; i < pos.count; i += 2) { let bi = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = sw.getComponent(i, k); if (w > bw) { bw = w; bi = sk.getComponent(i, k); } } if (bi !== fi) continue; skin.getVertexPosition(i, V); skin.localToWorld(V); line.closestPointToPoint(V, true, c); sum += c.distanceTo(V); n++; }
      armR[sd] = n ? sum / n : 0; } }
    report['armRadius_' + role] = { L: +armR.Left.toFixed(3), R: +armR.Right.toFixed(3) };
    const pose = t => { mixer.setTime(t); Hd.updateMatrixWorld(true); if (fit) fitSnowArms(Bn, Hd, fit); Hd.updateMatrixWorld(true); };
    const measure = t => {
      pose(t); frame();
      const V = new THREE.Vector3(), pts = tv.map(i => { skin.getVertexPosition(i, V); skin.localToWorld(V); return chest(V.clone()); });
      // torso cross-section at height y: x/z extents of torso vertices in a 10 cm band
      const band = y => { let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, n = 0; for (const p of pts) if (Math.abs(p.y - y) < 0.1) { n++; x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); } return n < 6 ? null : { x0, x1, z0, z1 }; };
      const rep = { t: +t.toFixed(2) }, flags = [];
      for (const n of ['LeftArm', 'LeftForeArm', 'LeftHand', 'RightArm', 'RightForeArm', 'RightHand']) rep[n] = loc(Bn[n]).toArray().map(v => +v.toFixed(2));
      for (const n of ['LeftForeArm', 'LeftHand']) if (rep[n][0] < 0.02) flags.push(n + ' crosses to his RIGHT (x ' + rep[n][0] + ')');
      for (const n of ['RightForeArm', 'RightHand']) if (rep[n][0] > -0.02) flags.push(n + ' crosses to his LEFT (x ' + rep[n][0] + ')');
      for (const n of ['LeftForeArm', 'RightForeArm', 'LeftHand', 'RightHand']) {
        const [x, y, z] = rep[n], b = band(y); if (!b) continue;
        const ar = /ForeArm/.test(n) ? armR[/Left/.test(n) ? 'Left' : 'Right'] : 0;   // an elbow touches the belly when its own fat does
        const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2, hx = (b.x1 - b.x0) / 2 + ar, hz = (b.z1 - b.z0) / 2 + ar;
        const e = ((x - cx) / hx) ** 2 + ((z - cz) / hz) ** 2;   // < 1 = inside the torso ellipse
        rep[n + '_in'] = +e.toFixed(2); rep[n + '_torsoHalf'] = [+hx.toFixed(2), +hz.toFixed(2)];
        if (e < 1) flags.push(n + (ar ? ' (its skin)' : '') + ' INSIDE the body (ellipse ' + e.toFixed(2) + ' < 1; |x| ' + Math.abs(x - cx).toFixed(2) + ' vs half-width ' + hx.toFixed(2) + ')');
      }
      rep.flags = flags; return rep;
    };
    const samples = []; for (let k = 0; k < NS; k++) samples.push(measure(clip.duration * k / NS));
    const worst = samples.reduce((m, s) => s.flags.length > m.flags.length ? s : m, samples[NS >> 1]);
    const minIn = {}; for (const n of ['LeftForeArm', 'RightForeArm', 'LeftHand', 'RightHand']) minIn[n] = Math.min(...samples.map(s => s[n + '_in'] ?? 99));
    report[role] = { stem, flagged: samples.filter(s => s.flags.length).length + '/' + NS, flags: samples.reduce((n, s) => n + s.flags.length, 0), minEllipse: minIn, worst };
    pose(worst.t);
    inst.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ color: 0xa8b8d0, transparent: true, opacity: 0.2, depthWrite: false }); o.frustumCulled = false; } });
    const Pw = o => o.getWorldPosition(new THREE.Vector3()), top = new THREE.Group(); sc.add(top);
    inst.traverse(b => {
      if (!b.isBone || /weapon|gun_tip|Toe_End|HeadTop/.test(b.name)) return;
      const n = b.name.replace(/^mixamorig[_:]?/, ''); if (/Hand(Thumb|Index|Middle|Ring|Pinky)[234]/.test(n)) return;
      const col = COL[side(n)], p0 = Pw(b);
      const j = new THREE.Mesh(new THREE.SphereGeometry(/Hand(Thumb|Index|Middle|Ring|Pinky)/.test(n) ? 0.015 : 0.035, 8, 6), new THREE.MeshBasicMaterial({ color: col, depthTest: false })); j.position.copy(p0); j.renderOrder = 3; top.add(j);
      if (b.parent?.isBone) { const p1 = Pw(b.parent), len = p0.distanceTo(p1); if (len > 1e-3) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, len, 6), new THREE.MeshBasicMaterial({ color: col, depthTest: false })); c.position.copy(p0).add(p1).multiplyScalar(0.5); c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p0.clone().sub(p1).normalize()); c.renderOrder = 2; top.add(c); } }
    });
    for (let vi = 0; vi < views.length; vi++) {
      const [, ang] = views[vi], cam = new THREE.PerspectiveCamera(30, VW / VH, 0.01, 100);
      if (ang === 'top') { cam.position.set(0, 9, 0.001); cam.up.set(0, 0, 1); cam.lookAt(0, 1.3, 0); }
      else { cam.position.set(Math.sin(ang) * 8, 1.4, Math.cos(ang) * 8); cam.lookAt(0, 1.3, 0); }
      r.setViewport(vi * VW, H - (ri + 1) * VH, VW, VH); r.setScissor(vi * VW, H - (ri + 1) * VH, VW, VH); r.render(sc, cam);
    }
    sc.remove(Hd);
  }
  window.report = report; window.done = 1;
})().catch(e => { window.report = { error: e.message + ' ' + e.stack }; window.done = 1; });
</script>
