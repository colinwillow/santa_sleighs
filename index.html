<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2340">
<meta property="og:title" content="Santa Slays">
<meta property="og:image" content="images/cover.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Santa Slays</title>
<!-- HOME SCREEN ICON. The version is in the FILENAME, never a query string: iOS caches an icon by URL forever and drops an
     apple-touch-icon link whose href has a query (Korajin m4612). New icon = new -vN files + repoint these. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v1.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v1.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32-v1.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Santa Slays">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2340;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  /* build number: below the status bar (iOS blurs the top strip), a readable pill */
  #build { position: fixed; z-index: 9; top: calc(env(safe-area-inset-top) + 34px); left: calc(env(safe-area-inset-left) + 10px);
    font: 800 13px/1 ui-monospace, monospace; color: #9ff; background: #0009; border-radius: 10px; padding: 5px 8px; pointer-events: none; }
  /* HUD LOOK (b27, his: "take the game logo and the flat drawn style"): sticker buttons -- thick ink outline, a solid offset
     shadow (no blur: never CSS filter / drop-shadow / backdrop-filter on always-on HUD, iOS re-rasterises them), candy-cane red,
     gold, icing cream, milk green; slightly wonky radii + a tilt = hand drawn. Sizes / positions are unchanged. */
  :root { --ink: #1d1420; --cream: #fcefd4; --candy: #e8263a; --pink: #ff3d7f; --gold: #f4b73a; --milk: #3dbb6a; }
  #stats { position: fixed; top: calc(env(safe-area-inset-top) + 6px); right: calc(env(safe-area-inset-right) + 10px);
    font: italic 900 13px/1.2 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); text-align: right;
    background: var(--cream); border: 2.5px solid var(--ink); border-radius: 12px 15px 11px 16px / 15px 11px 16px 12px;
    padding: 2px 9px 2px 8px; box-shadow: 2px 3px 0 var(--ink); transform: rotate(1.5deg); }
  .btn { position: fixed; pointer-events: auto; border-radius: 50%; display: grid; place-items: center;
    font: italic 900 13px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--cream); letter-spacing: .05em;
    border: 3px solid var(--ink); box-shadow: 3px 4px 0 var(--ink); text-shadow: 1.5px 1.5px 0 var(--ink); }
  .btn > * { pointer-events: none; }
  /* b79: BOOST sits above the left stick (input.js BOOSTB places + sizes it; sleigh only) */
  #boost { width: 62px; height: 62px; z-index: 7; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 66px);
    border-radius: 48% 52% 50% 50% / 53% 47% 53% 47%; transform: rotate(-5deg); align-content: center; gap: 1px; font-size: 12px;
    background: radial-gradient(circle at 34% 28%, #8ee8a8 0 14%, transparent 15%), var(--milk);
    box-shadow: inset 0 0 0 3px #bff2cf, 3px 4px 0 var(--ink); }
  #boost svg { width: 20px; height: 27px; display: block; margin: 0 auto; }
  .btn.on { transform: translate(2px, 3px) scale(.94); box-shadow: 1px 1px 0 var(--ink); }
  #boost.on { transform: rotate(-5deg) translate(2px, 3px) scale(.94); box-shadow: inset 0 0 0 3px #fff, 1px 1px 0 var(--ink); }
  #hopBtn, #weaponBtn { border-radius: 14px 19px 15px 18px / 18px 14px 19px 15px; padding: 8px 12px 9px; }
  #hopBtn { background: linear-gradient(var(--candy) 0 58%, #b8142a 58%); transform: rotate(-2deg); }
  #weaponBtn { background: linear-gradient(var(--gold) 0 58%, #d98f1c 58%); color: var(--ink); text-shadow: 1px 1px 0 #ffe9a8; transform: rotate(2deg); }
  #jumpBtn { background: radial-gradient(circle at 34% 28%, #bfe4ff 0 14%, transparent 15%), #3b8fe0; transform: rotate(4deg); }
  /* loading card: his cover art, fills the screen (blurred copy behind), fades once the crew is in */
  #boot { position: fixed; inset: 0; z-index: 10; background: #1b2340; transition: opacity .8s; pointer-events: none; }
  #boot .bg { position: absolute; inset: -40px; background: url(images/cover.jpg) center/cover; filter: blur(24px) brightness(.6); }
  #boot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #boot.gone { opacity: 0; }
  body.sandbox #hud, body.sandbox #boot { display: none; }
  #hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
    font: 600 13px/1.3 inherit; opacity: .8; text-align: center; transition: opacity 1s; white-space: nowrap; }
</style>
<script>
  // FRESH FILES EVERY BUILD (no stale phone caches): fetch version.json uncached, then build the import map so every module URL
  // carries ?v=<build>. Browsers key their cache on the full URL, so a new build = new URLs = fresh files; same build = cached.
  window.__importsReady = fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => null).then(v => {
    const q = v ? '?v=' + v.build : '';
    const map = { imports: { three: './vendor/three.module.min.js' + q, 'three/addons/': './vendor/' } };
    if (v) for (const f of v.files) map.imports[new URL(f, location.href).href] = new URL(f + q, location.href).href;
    const s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(map); document.head.appendChild(s);
    window.__build = v?.build;
  });
</script>
</head>
<body>
<div id="boot"><div class="bg"></div><img src="images/cover.jpg" alt="Santa Slays"></div>
<div id="hud">
  <div id="build">b<span id="bnum">1</span></div>
  <div id="stats">🍪 <span id="cookies">0</span> &nbsp; 🥛 <span id="milk">100</span></div>
  <div id="boost" class="btn"><svg viewBox="0 0 22 30"><path d="M8 2.5h6v4.5l3.2 4.2c.9 1.2 1.3 2.4 1.3 3.9V25c0 1.4-1 2.5-2.5 2.5H6c-1.5 0-2.5-1.1-2.5-2.5v-9.9c0-1.5.4-2.7 1.3-3.9L8 7z" fill="#fffaf0" stroke="#1d1420" stroke-width="2.2" stroke-linejoin="round"/><path d="M7.4 2h7.2v4.2H7.4z" fill="#e8263a" stroke="#1d1420" stroke-width="2" stroke-linejoin="round"/><path d="M5.6 17.5c2.4 1.3 4.6-.8 6.8.4 1.6.8 3 .6 4-.3V25H5.6z" fill="#d8ecff"/><path d="M6.5 13.5v6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg><span>BOOST</span></div>
  <div id="hint">tap a stick = jump · in the air hold left = jetpack</div>
</div>
<script>
window.__importsReady.then(() => { const s = document.createElement('script'); s.type = 'module'; s.textContent = document.getElementById('entry').textContent; document.body.appendChild(s); });
</script>
<script type="text/plain" id="entry">
  // ?scene=sandbox -> the white character sandbox; ?scene=destruct -> the destructible gingerbread test; anything else -> the game
  const sc = new URLSearchParams(location.search).get('scene');
  if (sc === 'sandbox') { document.body.classList.add('sandbox'); import('./src/sandbox.js'); }
  else if (sc === 'destruct') { document.body.classList.add('sandbox'); import('./src/destructshow.js'); }
  else if (sc === 'gunpose') { document.body.classList.add('sandbox'); import('./src/gunpose.js'); }
  else import('./src/main.js');
  // the build number, also on test pages (from version.json)
  if (window.__build) { const bn = document.getElementById('bnum'); if (bn) bn.textContent = window.__build; }
  // every test page gets a way home
  const q = new URLSearchParams(location.search);
  if (sc || q.has('cam')) {
    const b = document.createElement('a'); b.href = './'; b.textContent = '◀ MENU';
    b.style.cssText = 'position:fixed;z-index:9;left:calc(env(safe-area-inset-left) + 8px);top:calc(env(safe-area-inset-top) + 64px);font:800 13px ui-rounded,system-ui,sans-serif;color:#fff;background:#c42a2aee;border:2px solid #fff8;border-radius:14px;padding:9px 12px;text-decoration:none';
    document.body.appendChild(b);
  }
</script>
</body>
</html>
